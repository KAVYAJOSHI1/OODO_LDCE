{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GlobeTrotter</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--background);">

<div style="width: 100%; max-width: 400px; padding: 20px;">
    <div style="text-align: center; margin-bottom: 24px;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: var(--primary); color: white; font-size: 24px; font-weight: bold; border-radius: 10px; margin-bottom: 12px;">
            G
        </div>
        <h1 style="font-size: 24px; font-weight: 700; color: var(--dark);">GlobeTrotter</h1>
        <p style="color: var(--muted); font-size: 14px; margin-top: 4px;">Sign in to manage your trips & itineraries</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="card">
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" for="username">Username / Email</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 13px;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" name="remember_me"> Remember me
                </label>
                <a href="#" style="color: var(--primary); font-weight: 500;">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                Sign In 
            </button>
        </form>
    </div>

    <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted);">
        Don't have an account? <a href="{% url 'signup' %}" style="color: var(--primary); font-weight: 600;">Sign up now</a>
    </div>
</div>

</body>
</html>
