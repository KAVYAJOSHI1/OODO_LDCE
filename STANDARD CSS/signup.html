<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | GlobeTrotter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--background); padding: 40px 0;">

<div style="width: 100%; max-width: 440px; padding: 20px;">
    <div style="text-align: center; margin-bottom: 24px;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: var(--primary); color: white; font-size: 24px; font-weight: bold; border-radius: 10px; margin-bottom: 12px;">
            G
        </div>
        <h1 style="font-size: 24px; font-weight: 700; color: var(--dark);">Create your account</h1>
        <p style="color: var(--muted); font-size: 14px; margin-top: 4px;">Join GlobeTrotter to plan smart Odoo travel itineraries</p>
    </div>

    <div class="card">
        <form action="dashboard.html" method="GET">
            <div class="grid grid-2" style="margin-bottom: 0;">
                <div class="form-group">
                    <label class="form-label" for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" placeholder="Kavya" value="Kavya" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Joshi" value="Joshi" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="kavyajoshi" value="kavyajoshi" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="kavya@example.com" value="kavya@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" value="password123" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" value="password123" required>
            </div>

            <div style="margin-bottom: 20px; font-size: 13px;">
                <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer;">
                    <input type="checkbox" name="terms" checked required style="margin-top: 2px;">
                    <span style="color: var(--text);">I agree to the <a href="#" style="color: var(--primary);">Terms of Service</a> & <a href="#" style="color: var(--primary);">Privacy Policy</a></span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                Create Account ➔
            </button>
        </form>
    </div>

    <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign in</a>
    </div>
</div>

</body>
</html>
